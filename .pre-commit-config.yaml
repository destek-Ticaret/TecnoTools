# Pre-commit hook'ları — commit öncesi otomatik lint + format.
# Kurulum:  pip install pre-commit && pre-commit install
# Elle çalıştır:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.15
    hooks:
      # Linter (otomatik düzeltmelerle)
      - id: ruff
        args: [--fix]
        files: ^backend/
      # Formatter
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.16.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        files: ^backend/app/
        additional_dependencies:
          - sqlalchemy[mypy]
          - pydantic
          - fastapi
          - cryptography

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
