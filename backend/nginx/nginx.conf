user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Body size — resim yüklemeler için (5MB sınırı backend'de)
    client_max_body_size 8m;

    # Reverse proxy header'ları
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    # GÜVENLİK: $remote_addr ile ÜZERİNE YAZ ($proxy_add_x_forwarded_for client'ın
    # gönderdiği değeri korur → IP spoofing ile admin whitelist/rate-limit atlatılır).
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rate limit zonları (slowapi backend'de var ama nginx katmanı da DDoS'a karşı)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
}
