# ─── HTTP → HTTPS yönlendirme ───
server {
    listen 80;
    listen [::]:80;
    server_name tecnotools.com www.tecnotools.com;

    # Let's Encrypt doğrulama yolu (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ana ─────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tecnotools.com www.tecnotools.com;

    # SSL sertifikaları (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/tecnotools.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tecnotools.com/privkey.pem;

    # Modern SSL ayarları (Mozilla intermediate profili)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — bir kez aktif edince geri dönüş zor; emin olduğunda aç
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── WebSocket ───────────────────
    location /api/ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;          # uzun bağlantı
        proxy_send_timeout 3600s;
    }

    # ─── SSE ─────────────────────────
    location /api/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";    # keep-alive
        proxy_buffering off;               # SSE chunk'larını anında gönder
        proxy_read_timeout 3600s;
    }

    # ─── API ─────────────────────────
    location /api/ {
        # Login endpoint için daha agresif rate limit
        # (PayTR callback'i bu pattern'e takılmasın diye exclude değil; backend hash doğrulaması var)
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 60s;
    }

    location = /api/auth/login {
        limit_req zone=api_login burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    # ─── Ürün resimleri (statik serve, backend'i bypass et) ───
    location /api/uploads/files/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Frontend statikleri ─────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # JS/CSS uzun cache
    location ~* \.(?:css|js|woff2?|svg|jpg|png|webp|ico)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}
