[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

# ─────────────────────────────────────────────────────────────
# Ruff — linter + formatter (tek araç)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
# Otomatik üretilen / dış kod
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Profesyonel, güçlü kural seti
select = [
    "E", "W",    # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "UP",         # pyupgrade
    "B",          # flake8-bugbear
    "C4",         # comprehensions
    "SIM",        # flake8-simplify
    "PIE",        # flake8-pie
    "PT",         # flake8-pytest-style
    "TID",        # tidy-imports
    "DTZ",        # datetime timezone
    "LOG", "G",  # logging
    "ASYNC",      # async hataları
    "RUF",        # ruff'a özel
]
ignore = [
    "E501",                       # satır uzunluğu → formatter yönetir
    "RUF001", "RUF002", "RUF003", # Türkçe metin "belirsiz unicode" değil
    "B008",                       # FastAPI Depends() default-arg deseni idiomatik
    "UP042",                      # str,Enum→StrEnum: str(member) davranışını değiştirir, riskli
    "SIM105",                     # try/except/pass okunabilirliği tercih meselesi
    "SIM108",                     # if/else yerine ternary zorlaması her zaman daha okunaklı değil
    "SIM117",                     # iç içe with bazen daha okunaklı
    "RUF059",                     # kullanılmayan unpack (_ ile) — düşük değer
    "RUF046",                     # int(round(...)) — zararsız
    "ASYNC109",                   # timeout parametreli async fonksiyon — bilinçli API
]

[tool.ruff.lint.per-file-ignores]
# Testlerde "assert a and b" (PT018) ve gevşek importlar kabul edilir
"tests/*" = ["PT018", "E402"]
# Manuel/canlı smoke scriptleri kuralları gevşek
"test_*.py" = ["PT018", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ─────────────────────────────────────────────────────────────
# Mypy — statik tip kontrolü
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
# Kademeli sertleştirme: yeni kod için strict, mevcut kod için makul taban
disallow_untyped_defs = false
exclude = ["alembic/", "tests/", "^test_.*\\.py$"]
# Not: 3. parti tipsiz kütüphaneler global ignore_missing_imports ile kapsanır.
