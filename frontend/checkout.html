  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* ── HEADER ── */
    .hdr { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--border); }
    [data-theme="dark"] .hdr { background: rgba(11,18,32,.85); }
    .hdr-inner { max-width: 1280px; margin: 0 auto; padding: .85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .55rem; font-weight: 800; color: var(--text); font-size: 1.05rem; text-decoration: none; }
    .brand:hover { text-decoration: none; }
    .brand-logo { width: 38px; height: 38px; border-radius: 10px; overflow: hidden; background: var(--surface); box-shadow: 0 2px 6px rgba(15,23,42,.08); }
    .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
    .hdr-steps { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .85rem; }
    .hdr-steps .step { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .55rem; border-radius: 999px; }
    .hdr-steps .step.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
    .hdr-steps .step.done { color: var(--success); }
    .hdr-steps .num { width: 20px; height: 20px; border-radius: 50%; background: var(--bg2); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; }
    .hdr-steps .step.active .num { background: var(--primary); color: #fff; }
    .hdr-steps .step.done .num { background: var(--success); color: #fff; }
    .hdr-steps .sep { color: var(--border-2); }
    .hdr-actions { display: flex; align-items: center; gap: .5rem; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .icon-btn:hover { background: var(--bg2); color: var(--primary); border-color: var(--primary); }
    .icon-btn svg { width: 18px; height: 18px; }
    @media (max-width: 800px) { .hdr-steps { display: none; } }

    /* ── CONTAINER ── */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .page-head { margin-bottom: 1.5rem; }
    .page-head h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.01em; }
    .page-head p { color: var(--muted); font-size: .92rem; margin-top: .25rem; }

    /* ── LAYOUT ── */
    .checkout-grid { display: grid; grid-template-columns: 1fr 400px; gap: 1.5rem; align-items: start; }
    @media (max-width: 980px) { .checkout-grid { grid-template-columns: 1fr; } }

    /* ── SECTION CARDS ── */
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.25rem; }
    .section h2 { font-size: 1.05rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: .55rem; }
    .section h2 .num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .8rem; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .85rem; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .85rem; }
    @media (max-width: 600px) { .grid, .grid-3 { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: .3rem; }
    .field.full { grid-column: 1 / -1; }
    .label { font-size: .82rem; font-weight: 600; color: var(--text-2); }
    .label .req { color: var(--danger); margin-left: 2px; }
    .label .opt { color: var(--muted); font-weight: 500; font-size: .78rem; margin-left: 4px; }
    .input, .select, .textarea {
      width: 100%; padding: .7rem .85rem; border: 1px solid var(--border-2); border-radius: 10px;
      font: inherit; font-size: .92rem; color: var(--text); background: var(--surface); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .input:disabled, .select:disabled, .textarea:disabled { background: var(--bg2); color: var(--muted); cursor: not-allowed; }
    .input.err, .select.err, .textarea.err { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
    .textarea { resize: vertical; min-height: 70px; }
    .field-hint { font-size: .76rem; color: var(--muted); }
    .field-hint.err { color: var(--danger); }
    .field-hint.ok { color: var(--success); }

    /* Radio / Choice cards */
    .choices { display: flex; flex-direction: column; gap: .5rem; }
    .choice { display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem; border: 1px solid var(--border-2); border-radius: 12px; cursor: pointer; transition: border-color .15s, background .15s; background: var(--surface); }
    .choice:hover { border-color: var(--primary); }
    .choice input[type="radio"] { margin: 0; accent-color: var(--primary); width: 18px; height: 18px; flex-shrink: 0; cursor: pointer; }
    .choice.selected { border-color: var(--primary); background: var(--primary-soft); }
    [data-theme="dark"] .choice.selected { background: rgba(37,99,235,.15); }
    .choice .lbl { font-weight: 600; color: var(--text); font-size: .95rem; }
    .choice .desc { font-size: .8rem; color: var(--muted); margin-top: 2px; }
    .choice .meta { margin-left: auto; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .card-logos { display: inline-flex; align-items: center; gap: .35rem; }
    .card-logo { display: block; box-shadow: 0 1px 2px rgba(15,23,42,.08); border-radius: 4px; }
    [data-theme="dark"] .card-logo { box-shadow: 0 1px 2px rgba(0,0,0,.4); }

    /* Kupon chip */
    .coupon-bar { display: flex; align-items: center; gap: .5rem; padding: .65rem .85rem; background: var(--success-soft); color: var(--success); border-radius: 10px; font-size: .9rem; font-weight: 600; margin-top: .5rem; }
    .coupon-bar button { margin-left: auto; background: none; border: none; color: var(--success); text-decoration: underline; cursor: pointer; font-weight: 600; }

    /* ── SUMMARY ── */
    .summary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; position: sticky; top: 5.5rem; }
    .summary h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; }
    .item-list { margin-bottom: 1rem; }
    .item-list .item { display: grid; grid-template-columns: 48px 1fr auto; gap: .65rem; padding: .55rem 0; border-bottom: 1px dashed var(--border); align-items: center; }
    .item-list .item:last-child { border-bottom: none; }
    .item-thumb { width: 48px; height: 48px; border-radius: 8px; background: var(--bg2); display: grid; place-items: center; overflow: hidden; font-size: 1.3rem; }
    .item-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .item-name { font-size: .85rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .item-qty { font-size: .75rem; color: var(--muted); }
    .item-price { font-size: .9rem; font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }
    .sum-row { display: flex; justify-content: space-between; align-items: baseline; padding: .45rem 0; font-size: .9rem; }
    .sum-row .k { color: var(--muted); }
    .sum-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .sum-row .v.discount { color: var(--success); }
    .sum-divider { border: none; border-top: 1px dashed var(--border-2); margin: .35rem 0; }
    .sum-row.total { font-size: 1.1rem; margin-top: .25rem; }
    .sum-row.total .k { color: var(--text); font-weight: 700; }
    .sum-row.total .v { color: var(--primary); font-weight: 800; font-size: 1.25rem; }

    /* .btn temel stilleri base.css'te */

    /* Loading overlay */
    .overlay { position: fixed; inset: 0; background: rgba(15,23,42,.7); z-index: 300; display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .overlay.show { display: flex; }
    .overlay .box { background: var(--surface); border-radius: 16px; padding: 2rem; max-width: 360px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    .overlay .spinner { width: 48px; height: 48px; margin: 0 auto 1rem; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty cart redirect */
    .info-box { background: var(--info-soft); border: 1px solid #93c5fd; border-radius: 12px; padding: 1.5rem; text-align: center; color: var(--text-2); }
    [data-theme="dark"] .info-box { color: #c1cce0; border-color: #1e3a8a; }
    .info-box h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: .5rem; color: var(--text); }
    .info-box p { margin-bottom: 1rem; font-size: .92rem; }
    .info-box a { display: inline-block; }

    /* Toast */
    .toast-stack { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: .5rem; z-index: 200; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1.1rem; box-shadow: var(--shadow); font-size: .88rem; font-weight: 600; animation: slideIn .25s ease; max-width: 360px; }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.danger { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--primary); }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } }

    /* KVKK onay */
    .consent { display: flex; align-items: flex-start; gap: .55rem; font-size: .85rem; color: var(--text-2); line-height: 1.5; margin-top: .5rem; }
    .consent input { margin-top: 3px; flex-shrink: 0; accent-color: var(--primary); width: 16px; height: 16px; }
    .consent a { color: var(--primary); }

    /* Footer */
    .ftr { border-top: 1px solid var(--border); background: var(--surface); padding: 1.5rem; text-align: center; font-size: .82rem; color: var(--muted); }
    .ftr a { color: var(--muted); margin: 0 .5rem; }
    .ftr a:hover { color: var(--primary); }

    /* ── MOBİL DÜZELTMELER ── */

    /* 1) Sipariş özeti mobilde formun üstüne taşınır */
    @media (max-width: 980px) {
      .summary { order: -1; position: static; }
    }

    /* 2) Submit buton — ₺ tutarı alt satıra iner, kırılmaz */
    .submit-inner { display: flex; flex-direction: column; align-items: center; gap: .15rem; }
    .submit-amount { font-size: .8rem; opacity: .85; font-weight: 600; }
    @media (min-width: 480px) {
      .submit-inner { flex-direction: row; gap: .5rem; }
      .submit-amount { font-size: inherit; opacity: 1; }
    }

    /* 3) Kart logoları dar ekranda küçülür */
    @media (max-width: 480px) {
      .card-logos img { height: 18px !important; }
      .choice { padding: .7rem .75rem; gap: .55rem; }
      .choice .lbl { font-size: .88rem; }
      .choice .desc { font-size: .74rem; }
    }

    /* 4) Section padding küçülür */
    @media (max-width: 480px) {
      .section { padding: 1rem; }
      .section h2 { font-size: .98rem; }
      .wrap { padding: 1rem .9rem 3rem; }
      .page-head h1 { font-size: 1.35rem; }
      .page-head p { font-size: .85rem; }
    }

    /* 5) iOS zoom önleme — input font-size ≥ 16px */
    @media (max-width: 860px) {
      .input, .select, .textarea { font-size: 16px !important; }
    }

    /* 6) Toast taşma düzeltmesi */
    @media (max-width: 400px) {
      .toast-stack { left: .75rem; right: .75rem; }
      .toast { max-width: 100%; }
    }

    /* 7) Taksit satırları dar ekranda sarılır */
    @media (max-width: 480px) {
      #taksitList [style*="display:flex"] { flex-wrap: wrap; gap: .35rem; }
    }

    /* 8) Summary içindeki ürün listesi öğeleri dar ekranda kırılmaz */
    @media (max-width: 400px) {
      .item-list .item { grid-template-columns: 40px 1fr auto; gap: .45rem; }
      .item-thumb { width: 40px; height: 40px; }
      .item-name { font-size: .8rem; }
      .item-price { font-size: .82rem; }
    }

    /* 9) Mobil'de summary katlanabilir — başlık tıklanabilir */
    .summary-toggle { display: none; }
    @media (max-width: 980px) {
      .summary-toggle {
        display: flex; align-items: center; justify-content: space-between;
        width: 100%; background: none; border: none; cursor: pointer;
        padding: 0; color: var(--text); font-family: inherit;
      }
      .summary-toggle svg { transition: transform .25s ease; flex-shrink: 0; }
      .summary-toggle.collapsed svg { transform: rotate(-90deg); }
      .summary-body { transition: opacity .2s ease; }
      .summary-body.collapsed { display: none; }
      .summary { padding: 1.1rem 1.25rem; }
    }
  </style>

<script>
/* ── STATE ── */
let cart = [];
let productMap = {};
let appliedCoupon = null;
let loyalty = null;            // üye girişliyse /customer-auth/loyalty sonucu
let useLoyaltyPoints = false;  // "puanlarımı kullan" anahtarı
let shippingSettings = { shipping_free_threshold: 500, shipping_fee_default: 49.9, tax_rate: 20 };
let shippingCarriers = [];     // backend'den dinamik (admin tarafından ayarlanabilir)
let formData = {
  name: '', email: '', phone: '', city: '', address: '',
  invoice_type: 'individual',     // individual | corporate
  tax_no: '', tax_office: '', company_title: '',
  carrier: 'standard',            // standard, hızlı kargo vs. — şimdilik tek seçenek
  payment_method: 'card',         // card | wire | cod
  note: '',
  consent_kvkk: false,
  consent_distance_sales: false,
};
let submitting = false;
let lookupDebounce = null;

/* ── HELPERS ── */
const $ = sel => document.querySelector(sel);
// escapeHtml / escapeAttr → js/common.js (ortak)
const fmt = n => '₺' + Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const EMAIL_KEY = 'tt_last_order_email';
const CONSENT_KEY = 'tt_consent_v2';
const COUPON_SESSION_KEY = 'tt_coupon_for_checkout';
const SHIPPING_FREE_DEFAULT = 500;
const SHIPPING_FEE_DEFAULT = 49.9;

function showToast(text, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = text;
  $('#toastStack').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 3000);
}

function showOverlay(title, sub = '') {
  $('#overlayTitle').textContent = title;
  $('#overlaySub').textContent = sub;
  $('#overlay').classList.add('show');
}
function hideOverlay() { $('#overlay').classList.remove('show'); }

// applyTheme / toggleTheme → js/common.js (ortak)

function getCart() { try { return JSON.parse(localStorage.getItem('tt_cart') || '[]'); } catch { return []; } }
function variantOf(item) {
  if (!item.variant_id) return null;
  const p = productMap[item.id];
  if (p && Array.isArray(p.variants)) return p.variants.find(v => v.id === item.variant_id) || null;
  return null;
}
function unitPriceOf(item) {
  const v = variantOf(item);
  if (v) return Number(v.price || 0);
  const p = productMap[item.id];
  return p ? Number(p.price || 0) : Number(item.price || 0);
}
function effectiveStockOf(item) {
  const v = variantOf(item);
  if (v) return v.effective_stock || 0;
  const p = productMap[item.id];
  if (!p) return 0;
  return typeof p.effective_stock === 'number' ? p.effective_stock : (p.stock || 0);
}

function computeTotals() {
  const subtotal = cart.reduce((s, it) => s + unitPriceOf(it) * (it.qty || 0), 0);
  let discount = 0;
  if (appliedCoupon) {
    if (appliedCoupon.type === 'percent') discount = subtotal * (Number(appliedCoupon.value) / 100);
    else if (appliedCoupon.type === 'fixed') discount = Math.min(Number(appliedCoupon.value), subtotal);
  }
  // Puan indirimi — sunucu formülünün aynası: min(puan×0.1, kupon sonrası ara toplamın %20'si)
  let loyaltyDiscount = 0;
  if (useLoyaltyPoints && loyalty && loyalty.points > 0) {
    const afterCoupon = Math.max(0, subtotal - discount);
    loyaltyDiscount = Math.round(Math.min(loyalty.points * 0.1, afterCoupon * 0.2) * 100) / 100;
  }
  const taxable = Math.max(0, subtotal - discount - loyaltyDiscount);
  const tax = taxable * (Number(shippingSettings.tax_rate) / 100);
  const fee = Number(shippingSettings.shipping_fee_default) || 0;
  const threshold = Number(shippingSettings.shipping_free_threshold) || 0;
  const shipping = (taxable > 0 && taxable < threshold) ? fee : 0;
  const total = taxable + tax + shipping;
  return { subtotal, discount, loyaltyDiscount, tax, shipping, total, taxable };
}

function toggleLoyalty(checked) {
  useLoyaltyPoints = !!checked;
  render();
}

function loadCouponFromSession() {
  try {
    const raw = sessionStorage.getItem(COUPON_SESSION_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (c && c.code && (c.type === 'percent' || c.type === 'fixed')) return c;
  } catch (_) {}
  return null;
}
function clearCouponSession() {
  try { sessionStorage.removeItem(COUPON_SESSION_KEY); } catch (_) {}
}

function prefillFromStorage() {
  // Üye girişi yapmışsa email'i doldur

    const access = localStorage.getItem('tt_customer_access');

    }

}

function attachFormHandlers() {
  // Form alanlarından state'e yaz
  const fields = ['name', 'email', 'phone', 'city', 'address', 'tax_no', 'tax_office', 'company_title', 'note'];
  fields.forEach(name => {
    const el = document.querySelector(`[name="${name}"]`);
    if (!el) return;
    el.addEventListener('input', () => { formData[name] = el.value; });
  });

  // TCKN/VKN → GİB sorgu (debounce 600ms)
  const taxEl = document.getElementById('fTaxNo');
  if (taxEl) {
    taxEl.addEventListener('input', () => {
      formData.tax_no = taxEl.value;
      clearTimeout(lookupDebounce);
      const hint = document.getElementById('hTax');
      const val = taxEl.value.trim();
      // 11 hane → TCKN (bireysel), 10 hane → VKN (kurumsal)
      if (val.length === 10 || val.length === 11) {
        lookupDebounce = setTimeout(() => lookupTax(val, hint), 600);
      } else {
        if (hint) { hint.classList.remove('ok', 'err'); hint.textContent = '11 hane = TCKN (bireysel) · 10 hane = VKN (kurumsal). GİB\'den doğrulanır.'; }
        document.getElementById('corpBox').style.display = 'none';
        document.getElementById('taxOfficeBox').style.display = 'none';
        formData.invoice_type = 'individual';
      }
    });
  }

  // Radio choice kartları (görsel seçili)
  document.querySelectorAll('.choices').forEach(group => {
    group.querySelectorAll('.choice').forEach(ch => {
      ch.addEventListener('click', () => {
        group.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
        ch.classList.add('selected');
        const input = ch.querySelector('input');
        if (input) {
          input.checked = true;
          if (input.name === 'carrier') formData.carrier = input.value;
          if (input.name === 'payment_method') { formData.payment_method = input.value; updateTaksitVisibility(); }
        }
      });
    });
  });

  // Consent checkbox'ları
  const cKvkk = document.getElementById('cKvkk');
  if (cKvkk) cKvkk.addEventListener('change', () => { formData.consent_kvkk = cKvkk.checked; });
  const cMs = document.getElementById('cMs');
  if (cMs) cMs.addEventListener('change', () => { formData.consent_distance_sales = cMs.checked; });

  // Taksit önizleme: kart seçiliyse kutuyu göster, BIN girişini dinle
  const binEl = document.getElementById('taksitBin');
  if (binEl) binEl.addEventListener('input', onTaksitBinInput);
  updateTaksitVisibility();
}

/* ── Taksit önizleme ── */
let _taksitTimer = null;

function updateTaksitVisibility() {
  const box = document.getElementById('taksitBox');
  if (!box) return;
  const show = formData.payment_method === 'card';
  box.style.display = show ? 'block' : 'none';
  if (show) onTaksitBinInput();           // kart no zaten girilmişse tabloyu tazele
  else { const l = document.getElementById('taksitList'); if (l) l.innerHTML = ''; }
}

function onTaksitBinInput() {
  clearTimeout(_taksitTimer);
  _taksitTimer = setTimeout(loadTaksit, 400);  // debounce
}

async function loadTaksit() {
  const binEl = document.getElementById('taksitBin');
  const listEl = document.getElementById('taksitList');
  if (!binEl || !listEl) return;
  const bin = (binEl.value || '').replace(/\D/g, '').slice(0, 8);
  if (bin.length < 6) { listEl.innerHTML = ''; return; }
  const total = computeTotals().total;
  if (!(total > 0) || !window.api || !api.payments || !api.payments.installments) return;
  listEl.innerHTML = '<div style="font-size:.82rem;color:var(--muted);">Taksit seçenekleri yükleniyor…</div>';
  try {
    const data = await api.payments.installments(bin, total);
    renderTaksit(data);
  } catch (e) {
    listEl.innerHTML = `<div class="field-hint err">Taksit bilgisi alınamadı.</div>`;
  }
}

function renderTaksit(data) {
  const el = document.getElementById('taksitList');
  if (!el) return;
  if (!data || !Array.isArray(data.options) || !data.options.length) { el.innerHTML = ''; return; }
  const head = data.bank_name
    ? `<div style="font-size:.8rem;color:var(--muted);margin-bottom:.45rem;">${escapeHtml(data.bank_name)}${data.card_family ? ' · ' + escapeHtml(data.card_family) : ''}</div>`
    : '';
  const rows = data.options.map(o => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.5rem .7rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);">
      <span style="font-weight:600;font-size:.9rem;">${escapeHtml(o.label)}</span>
      <span style="font-size:.88rem;white-space:nowrap;">${o.count > 1 ? `<strong>${fmt(o.installment_price)}</strong><span style="color:var(--muted);"> × ${o.count} = </span>` : ''}<strong>${fmt(o.total_price)}</strong></span>
    </div>`).join('');
  el.innerHTML = head
    + `<div style="display:flex;flex-direction:column;gap:.4rem;">${rows}</div>`
    + (data.mock ? `<div style="font-size:.72rem;color:var(--muted);margin-top:.45rem;">* Örnek taksit planı (demo). Gerçek oran/komisyonlar bankaya göre değişir.</div>` : '');
}

async function lookupTax(value, hintEl) {
  if (!window.api || !api.tax || !api.tax.lookup) return;
  try {
    if (hintEl) { hintEl.classList.remove('err'); hintEl.classList.add('ok'); hintEl.textContent = 'GİB\'den sorgulanıyor…'; }
    const res = await api.tax.lookup(value, { queryGib: true });
    if (res && res.success) {
      const isCorporate = res.kind === 'corporate';
      formData.invoice_type = isCorporate ? 'corporate' : 'individual';
      if (isCorporate) {
        formData.company_title = res.title || '';
        formData.tax_office = res.tax_office || '';
        const tEl = document.getElementById('fCompanyTitle'); if (tEl) tEl.value = res.title || '';
        const oEl = document.getElementById('fTaxOffice'); if (oEl) oEl.value = res.tax_office || '';
        document.getElementById('corpBox').style.display = 'block';
        document.getElementById('taxOfficeBox').style.display = 'block';
        if (hintEl) hintEl.textContent = '✓ Kurumsal mükellef bulundu.';
      } else {
        document.getElementById('corpBox').style.display = 'none';
        document.getElementById('taxOfficeBox').style.display = 'none';
        if (hintEl) hintEl.textContent = '✓ Bireysel mükellef (TCKN doğrulandı).';
      }
    } else {
      if (hintEl) { hintEl.classList.remove('ok'); hintEl.classList.add('err'); hintEl.textContent = 'GİB\'de bulunamadı — bilgileri manuel girin.'; }
    }
  } catch (e) {
    if (hintEl) { hintEl.classList.remove('ok'); hintEl.classList.add('err'); hintEl.textContent = 'GİB sorgusu başarısız (' + (e.message || '') + ').'; }
  }
}

function removeCoupon() {
  appliedCoupon = null;
  clearCouponSession();
  render();
}

function toggleSummary() {
  const btn = document.getElementById('summaryToggle');
  const body = document.getElementById('summaryBody');
  if (!btn || !body) return;
  const collapsed = body.classList.toggle('collapsed');
  btn.classList.toggle('collapsed', collapsed);
  btn.setAttribute('aria-expanded', !collapsed);
}

/* ── VALIDATE ── */
function validateForm() {
  const required = [
    { id: 'fName', name: 'Ad Soyad', min: 3 },
    { id: 'fEmail', name: 'E-posta', test: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) },
    { id: 'fPhone', name: 'Telefon', min: 8 },
    { id: 'fAddress', name: 'Adres', min: 10 },
  ];
  for (const f of required) {
    const el = document.getElementById(f.id);
    if (!el) continue;
    const v = (el.value || '').trim();
    el.classList.remove('err');
    if (!v) { el.classList.add('err'); showToast(`${f.name} zorunlu.`, 'danger'); el.focus(); return false; }
    if (f.min && v.length < f.min) { el.classList.add('err'); showToast(`${f.name} en az ${f.min} karakter olmalı.`, 'danger'); el.focus(); return false; }
    if (f.test && !f.test(v)) { el.classList.add('err'); showToast(`${f.name} geçersiz.`, 'danger'); el.focus(); return false; }
  }
  if (!formData.consent_kvkk) { showToast('KVKK onayı zorunlu.', 'danger'); return false; }
  if (!formData.consent_distance_sales) { showToast('Mesafeli satış sözleşmesi onayı zorunlu.', 'danger'); return false; }
  return true;
}

/* ── SUBMIT ── */
async function submitOrder() {
  if (submitting) return;
  if (!validateForm()) return;

  // Sepetteki tüm ürünleri son bir kez stok kontrolünden geçir
  for (const it of cart) {
    if (effectiveStockOf(it) < it.qty) {
      showToast(`${it.name || 'Ürün'} için stok yetersiz. Sepete dönün.`, 'danger');
      setTimeout(() => location.href = 'cart.html', 1500);
      return;
    }
  }

  submitting = true;
  const btn = document.getElementById('submitBtn');
  if (btn) btn.disabled = true;
  showOverlay('Siparişiniz oluşturuluyor…', 'Lütfen bekleyin.');

  // state'i formdan tazele (kullanıcı yazdıktan sonra input'lar yazıldı)
  formData.name = document.getElementById('fName').value.trim();
  formData.email = document.getElementById('fEmail').value.trim();
  formData.phone = document.getElementById('fPhone').value.trim();
  formData.city = document.getElementById('fCity').value.trim();
  formData.address = document.getElementById('fAddress').value.trim();
  formData.tax_no = document.getElementById('fTaxNo').value.trim();
  formData.tax_office = document.getElementById('fTaxOffice').value.trim();
  formData.company_title = document.getElementById('fCompanyTitle').value.trim();
  formData.note = document.getElementById('fNote').value.trim();

  // Email'i sakla — order-success bunu kullanıyor
  try { localStorage.setItem(EMAIL_KEY, formData.email); } catch (_) {}

  // Checkout payload
  const payload = {
    items: cart.map(it => ({ product_id: it.id, qty: it.qty, variant_id: it.variant_id || null })),
    customer_name: formData.name,
    customer_email: formData.email,
    customer_phone: formData.phone,
    customer_city: formData.city || null,
    customer_address: formData.address,
    coupon_code: appliedCoupon ? appliedCoupon.code : null,
    note: formData.note || null,
    payment_method: formData.payment_method,
    // Puan kullanımı: tüm bakiye gönderilir, sunucu %20 sınırına göre kırpar
    use_loyalty_points: (useLoyaltyPoints && loyalty && loyalty.points > 0) ? loyalty.points : 0,
    tax_no: formData.tax_no || null,
    tax_office: formData.tax_office || null,
    company_title: formData.company_title || null,
  };

  try {
    const res = await api.orders.checkout(payload);
    if (!res || !res.order_no) throw new Error('Sipariş oluşturulamadı.');
    const orderNo = res.order_no;
    const paytr = res.payment_url || res.iframe_url || res.redirect_url || res.payment_token;
    // Backend PayTR iframe_token'i veya redirect URL'i döner
    if (res.iframe_token && res.ok_url) {
      // PayTR iframe akışı: ok_url'e order_no ekleyerek yönlendir, PayTR iframe orada açılır
      const okUrl = new URL(res.ok_url, location.origin);
      okUrl.searchParams.set('order_no', orderNo);
      hideOverlay();
      location.href = okUrl.toString();
      return;
    }
    if (paytr && /^https?:\/\//.test(paytr)) {
      hideOverlay();
      if (paytr.includes('paytr.com')) {
        // PayTR: token URL'e parametre ekleme, direkt yönlendir
        location.href = paytr;
      } else {
        // Stripe ve diğerleri: order_no ekle
        const sep = paytr.includes('?') ? '&' : '?';
        location.href = paytr + sep + 'order_no=' + encodeURIComponent(orderNo);
      }
      return;
    }
    // Yönlendirme yoksa direkt success sayfasına git (havale / kapıda)
    hideOverlay();
    clearCouponSession();
    location.href = 'order-success.html?order_no=' + encodeURIComponent(orderNo);
  } catch (e) {
    hideOverlay();
    submitting = false;
    if (btn) btn.disabled = false;
    showToast(e.message || 'Sipariş oluşturulamadı.', 'danger');
  }
}

/* ── INIT ── */
async function loadSettings() {
  if (!window.api || !api.settings || !api.settings.list) return;
  try {
    const s = await api.settings.list();
    if (s && typeof s === 'object') {
      if (s.shipping_free_threshold !== undefined) shippingSettings.shipping_free_threshold = Number(s.shipping_free_threshold);
      if (s.shipping_fee_default !== undefined) shippingSettings.shipping_fee_default = Number(s.shipping_fee_default);
      if (s.tax_rate !== undefined) shippingSettings.tax_rate = Number(s.tax_rate);
    }
  } catch (_) {}
}

async function loadProducts() {
  if (!window.api) return;
  try {
    const all = await api.products.listPublic();
    productMap = {};
    (all || []).forEach(p => { productMap[p.id] = p; });
  } catch (e) { productMap = {}; }
}

async function loadCustomerPrefill() {
  // Üye girişi yapmışsa ad/email bilgilerini doldur
  if (!window.api || !api.customerAuth) return;
  try {
    if (api.customerAuth.isLoggedIn && api.customerAuth.isLoggedIn()) {
      const me = await api.customerAuth.me();
      if (me) {
        if (!formData.name && me.name) formData.name = me.name;
        if (!formData.email && me.email) formData.email = me.email;
        if (!formData.phone && me.phone) formData.phone = me.phone;
        if (!formData.city && me.city) formData.city = me.city;
        if (!formData.address && me.address) formData.address = me.address;
      }
      // Sadakat puanı bakiyesi — varsa özet kutusunda "puan kullan" seçeneği çıkar
      try { loyalty = await api.customerAuth.myLoyalty(); } catch (_) { loyalty = null; }
    }
  } catch (_) {}
}

async function init() {
  applyTheme();
  prefillFromStorage();
  appliedCoupon = loadCouponFromSession();
  cart = getCart();

  if (!cart.length) {
    renderEmpty();
    return;
  }

  const cartTotal = cart.reduce((s, it) => s + (Number(it.price) || 0) * (it.qty || 1), 0);
  if (window.ttTrack) ttTrack('InitiateCheckout', { value: cartTotal });

  render(); // ilk render — totals hesabı için gerekli
  await Promise.all([loadSettings(), loadProducts(), loadCustomerPrefill()]);
  render(); // bilgilerle yeniden render
}

ttReady(init);
</script>
