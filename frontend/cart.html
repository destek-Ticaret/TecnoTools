<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="tt-api-base" content="https://api.tecnotools.org" />
  <meta name="description" content="Sepetinizdeki ürünleri görüntüleyin, kupon uygulayın ve güvenle ödemeye geçin." />
  <meta name="robots" content="noindex,nofollow" />
  <title>Sepetim — TecnoTools</title>
  <link rel="icon" href="images/logo-300x100.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="js/common.js?v=1"></script>
  <script src="js/config.js"></script>
  <script src="js/tracking.js" defer></script>
  <script src="js/api.js?v=20260611" defer></script>
  <link rel="stylesheet" href="css/base.css?v=1" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; }
    img { display: block; max-width: 100%; }

    /* ── HEADER ── */
    .hdr { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.92); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--border); }
    [data-theme="dark"] .hdr { background: rgba(11,18,32,.85); }
    .hdr-inner { max-width: 1280px; margin: 0 auto; padding: .85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .55rem; font-weight: 800; color: var(--text); font-size: 1.05rem; text-decoration: none; }
    .brand:hover { text-decoration: none; }
    .brand-logo { display: flex; align-items: center; }
    .brand-logo img { height: 40px; width: auto; display: block; }
    .hdr-actions { display: flex; align-items: center; gap: .5rem; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
    .icon-btn:hover { background: var(--bg2); color: var(--primary); border-color: var(--primary); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* ── CONTAINER ── */
    .wrap { max-width: 1280px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    .page-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: .5rem; }
    .page-head h1 { font-size: 1.65rem; font-weight: 800; letter-spacing: -0.01em; }
    .page-head .count { color: var(--muted); font-weight: 500; font-size: .95rem; }
    .clear-btn { background: none; border: none; color: var(--danger); font-size: .85rem; font-weight: 600; padding: .4rem .7rem; border-radius: 8px; transition: background .15s; }
    .clear-btn:hover { background: var(--danger-soft); }

    /* ── LAYOUT ── */
    .cart-grid { display: grid; grid-template-columns: 1fr 380px; gap: 1.5rem; align-items: start; }
    @media (max-width: 900px) { .cart-grid { grid-template-columns: 1fr; } }

    /* ── CART LINES ── */
    .cart-lines { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .line { display: grid; grid-template-columns: 90px 1fr auto; gap: 1rem; padding: 1rem 1.15rem; align-items: center; border-bottom: 1px solid var(--border); }
    .line:last-child { border-bottom: none; }
    @media (max-width: 560px) { .line { grid-template-columns: 70px 1fr; row-gap: .5rem; } .line .line-side { grid-column: 1 / -1; justify-self: end; } }
    .line-thumb { width: 90px; height: 90px; border-radius: 12px; background: var(--bg2); display: grid; place-items: center; overflow: hidden; font-size: 2.5rem; }
    .line-thumb img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 560px) { .line-thumb { width: 70px; height: 70px; font-size: 2rem; } }
    .line-info { min-width: 0; }
    .line-name { font-size: .98rem; font-weight: 700; color: var(--text); line-height: 1.35; margin-bottom: .2rem; }
    .line-name a { color: inherit; }
    .line-name a:hover { color: var(--primary); }
    .line-meta { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; font-size: .78rem; color: var(--muted); }
    .line-price { font-size: .9rem; font-weight: 600; color: var(--text-2); }
    .line-price-old { text-decoration: line-through; color: var(--muted); margin-right: .35rem; font-weight: 500; }
    .line-discount-chip { font-size: .7rem; font-weight: 700; background: #fef2f2; color: #dc2626; padding: .1rem .3rem; border-radius: 5px; margin-left: .35rem; }
    .stock-chip { display: inline-flex; align-items: center; gap: .3rem; padding: 2px 7px; border-radius: 999px; font-size: .7rem; font-weight: 700; }
    .stock-chip.ok { background: var(--success-soft); color: var(--success); }
    .stock-chip.low { background: var(--warning-soft); color: var(--warning); }
    .stock-chip.out { background: var(--danger-soft); color: var(--danger); }
    .line-side { display: flex; align-items: center; gap: 1rem; }
    .qty-stepper { display: flex; align-items: center; border: 1px solid var(--border-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
    .qty-stepper button { width: 34px; height: 36px; background: transparent; border: none; font-size: 1.1rem; color: var(--text); cursor: pointer; transition: background .15s; }
    .qty-stepper button:hover { background: var(--bg2); }
    .qty-stepper button:disabled { color: var(--muted); cursor: not-allowed; }
    .qty-stepper input { width: 40px; height: 36px; text-align: center; border: none; background: transparent; color: var(--text); font-weight: 700; font-size: .92rem; -moz-appearance: textfield; outline: none; }
    .qty-stepper input::-webkit-outer-spin-button, .qty-stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .line-total { font-size: 1.05rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }
    .line-remove { background: none; border: 1px solid var(--border); color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
    .line-remove:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
    .line-remove svg { width: 16px; height: 16px; }

    /* ── SUMMARY ── */
    .summary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; position: sticky; top: 5.5rem; }
    .summary h2 { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; }
    .sum-row { display: flex; justify-content: space-between; align-items: baseline; padding: .55rem 0; font-size: .92rem; }
    .sum-row .k { color: var(--muted); }
    .sum-row .v { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .sum-row .v.discount { color: var(--success); }
    .sum-row .v.shipping.free { color: var(--success); font-weight: 700; }
    .sum-divider { border: none; border-top: 1px dashed var(--border-2); margin: .35rem 0; }
    .sum-row.total { font-size: 1.1rem; }
    .sum-row.total .k { color: var(--text); font-weight: 700; }
    .sum-row.total .v { color: var(--primary); font-weight: 800; font-size: 1.25rem; }

    /* Kupon */
    .coupon { display: flex; gap: .5rem; margin: 1rem 0; }
    .coupon-input { flex: 1; padding: .6rem .8rem; border: 1px solid var(--border-2); border-radius: 9px; font: inherit; font-size: .88rem; background: var(--surface); color: var(--text); outline: none; transition: border-color .15s; text-transform: uppercase; letter-spacing: .05em; }
    .coupon-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    .coupon-input:disabled { background: var(--bg2); color: var(--muted); cursor: not-allowed; }
    .coupon-btn { padding: .6rem 1rem; background: var(--primary); color: #fff; border: none; border-radius: 9px; font-weight: 600; font-size: .85rem; cursor: pointer; transition: background .15s; }
    .coupon-btn:hover { background: var(--primary-dark); }
    .coupon-btn:disabled { opacity: .5; cursor: not-allowed; }
    .coupon-applied { display: flex; align-items: center; justify-content: space-between; padding: .55rem .75rem; background: var(--success-soft); color: var(--success); border-radius: 9px; font-size: .85rem; font-weight: 600; margin: .75rem 0; }
    .coupon-applied button { background: none; border: none; color: var(--success); font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0; }
    .coupon-hint { font-size: .78rem; color: var(--muted); margin-top: .25rem; min-height: 1.1em; }
    .coupon-hint.err { color: var(--danger); }

    /* CTA — .btn temel stilleri base.css'te */
    .continue-link { display: inline-flex; align-items: center; gap: .3rem; margin-top: .85rem; font-size: .85rem; color: var(--muted); font-weight: 500; }
    .continue-link:hover { color: var(--primary); }

    /* Empty state */
    .empty { text-align: center; padding: 4rem 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .empty .emoji { font-size: 4rem; display: block; margin-bottom: 1rem; opacity: .7; }
    .empty h2 { font-size: 1.3rem; font-weight: 800; margin-bottom: .5rem; }
    .empty p { color: var(--muted); margin-bottom: 1.5rem; }

    /* Trust badges */
    .trust { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .trust .item { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--muted); }
    .trust .item svg { width: 14px; height: 14px; color: var(--primary); }

    /* Toast */
    .toast-stack { position: fixed; bottom: 1.5rem; right: 1.5rem; display: flex; flex-direction: column; gap: .5rem; z-index: 200; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1.1rem; box-shadow: var(--shadow); font-size: .88rem; font-weight: 600; animation: slideIn .25s ease; max-width: 360px; }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.danger { border-left: 4px solid var(--danger); }
    .toast.info { border-left: 4px solid var(--primary); }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } }

    /* Footer */
    .ftr { border-top: 1px solid var(--border); background: var(--surface); padding: 1.5rem; text-align: center; font-size: .82rem; color: var(--muted); }
    .ftr a { color: var(--muted); margin: 0 .5rem; }
    .ftr a:hover { color: var(--primary); }

    /* ── MOBİL DÜZELTMELER ── */

    /* 1) Mobil checkout sticky bar — "Ödemeye Geç" her zaman görünür */
    .mob-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: .9rem 1.25rem calc(.9rem + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 24px rgba(15,23,42,.12);
      flex-direction: column; gap: .3rem;
    }
    @media (max-width: 900px) { .mob-bar { display: flex; } }
    .mob-bar-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .mob-bar-label { font-size: .8rem; color: var(--muted); font-weight: 500; }
    .mob-bar-total { font-size: 1.2rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .mob-bar .btn { flex: 1; padding: .85rem 1rem; font-size: .95rem; }

    /* 2) Mobilde summary sticky kaldır, sayfanın sonuna koy */
    @media (max-width: 900px) {
      .summary { position: static; }
      /* Sayfa altı: sticky bar gizlememesin */
      .wrap { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
    }

    /* 3) iOS zoom önleme */
    @media (max-width: 860px) {
      .coupon-input, .qty-stepper input { font-size: 16px !important; }
    }

    /* 4) Toast taşma */
    @media (max-width: 400px) {
      .toast-stack { left: .75rem; right: .75rem; }
      .toast { max-width: 100%; }
    }

    /* 5) Dar ekranlarda line-side sıkışma */
    @media (max-width: 400px) {
      .line-side { gap: .55rem; }
      .line-total { min-width: 70px; font-size: .95rem; }
      .qty-stepper button { width: 30px; height: 34px; }
      .qty-stepper input { width: 36px; height: 34px; }
      .line-remove { width: 28px; height: 28px; }
    }

    /* 6) Çok dar ekranlarda wrap padding küçülsün */
    @media (max-width: 400px) {
      .wrap { padding-left: .75rem; padding-right: .75rem; }
      .page-head h1 { font-size: 1.35rem; }
    }
  </style>
</head>

<script>
/* ── STATE ── */
let cart = [];                 // localStorage'dan yüklenen [{id, name, price, icon, image, qty}]
let productMap = {};           // id → Product (stok kontrolü için)
let appliedCoupon = null;      // {code, type, value, min_order} | null
let shippingSettings = {       // api.settings.list() ile doldurulur
  shipping_free_threshold: 500,
  shipping_fee_default: 49.9,
  tax_rate: 20,                // backend TAX_RATE ile uyumlu
};
let submitting = false;

/* ── HELPERS ── */
const $ = sel => document.querySelector(sel);
// escapeHtml / escapeAttr → js/common.js (ortak)
const fmt = n => '₺' + Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COUPON_KEY = 'tt_cart_coupon';

function showToast(text, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = text;
  $('#toastStack').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2800);
}

// applyTheme / toggleTheme → js/common.js (ortak)

function getCart() { try { return JSON.parse(localStorage.getItem('tt_cart') || '[]'); } catch { return []; } }
function saveCart(c) {
  cart = c;
  try { localStorage.setItem('tt_cart', JSON.stringify(cart)); } catch (_) {}
  syncReservations();
  renderHeaderCount();
}
function renderHeaderCount() {
  const total = cart.reduce((s, x) => s + (x.qty || 0), 0);
  $('#cartItemCount').textContent = `(${total} ürün)`;
  $('#clearBtn').style.display = cart.length ? 'inline-block' : 'none';
}

function clearCart() {
  if (!cart.length) return;
  if (!confirm('Sepetteki tüm ürünler silinsin mi?')) return;
  saveCart([]);
  appliedCoupon = null;
  try { localStorage.removeItem(COUPON_KEY); } catch (_) {}
  render();
  showToast('Sepet boşaltıldı', 'info');
}

function syncReservations() {
  if (!window.api) return;
  api.reservations
    .sync(cart.map(it => ({ product_id: it.id, qty: it.qty })))
    .catch(() => { /* backend yoksa sessizce devam */ });
}

/* Sepet kalemindeki varyantı güncel ürün verisinden çöz (yoksa null). */
function variantOf(item) {
  if (!item.variant_id) return null;
  const p = productMap[item.id];
  if (p && Array.isArray(p.variants)) return p.variants.find(v => v.id === item.variant_id) || null;
  return null;
}

/* Birim fiyat: varyantlıysa varyant fiyatı (güncel), değilse ürün fiyatı;
   ürün yüklenememişse sepetteki kayıtlı fiyata düşer. */
function unitPriceOf(item) {
  const v = variantOf(item);
  if (v) return Number(v.price || 0);
  const p = productMap[item.id];
  return p ? Number(p.price || 0) : Number(item.price || 0);
}

/* Stok = effective_stock (varyantlıysa varyantın). Ürün yoksa sıfır. */
function effectiveStockOf(item) {
  const v = variantOf(item);
  if (v) return v.effective_stock || 0;
  const p = productMap[item.id];
  if (!p) return 0;
  if (typeof p.effective_stock === 'number') return p.effective_stock;
  return p.stock || 0;
}

/* ── TOTALS (backend _calc_totals mantığı) ── */
function computeTotals() {
  const subtotal = cart.reduce((s, it) => s + unitPriceOf(it) * (it.qty || 0), 0);
  let discount = 0;
  if (appliedCoupon) {
    if (appliedCoupon.type === 'percent') {
      discount = subtotal * (Number(appliedCoupon.value) / 100);
    } else if (appliedCoupon.type === 'fixed') {
      discount = Math.min(Number(appliedCoupon.value), subtotal);
    }
  }
  const taxable = Math.max(0, subtotal - discount);
  const tax = taxable * (Number(shippingSettings.tax_rate) / 100);
  const fee = Number(shippingSettings.shipping_fee_default) || 0;
  const threshold = Number(shippingSettings.shipping_free_threshold) || 0;
  const shipping = (taxable > 0 && taxable < threshold) ? fee : 0;
  const total = taxable + tax + shipping;
  return { subtotal, discount, tax, shipping, total, taxable };
}

/* ── RENDER ── */
function render() {
  if (!cart.length) {
    renderEmpty();
    return;
  }
  renderCart();
}

function renderEmpty() {
  $('#content').innerHTML = `
    <div class="empty">
      <span class="emoji">🛒</span>
      <h2>Sepetiniz şu an boş</h2>
      <p>Beğendiğiniz ürünleri ekleyerek alışverişe başlayabilirsiniz.</p>
      <a href="index.html" class="btn btn-primary btn-block lg" style="max-width:280px;margin:0 auto;">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Alışverişe Devam
      </a>
      <p style="margin-top:1.25rem;font-size:.85rem;">
        <a href="index.html">Ana sayfa</a> ·
        <a href="track-order.html">Sipariş takibi</a>
      </p>
    </div>
  `;
  renderMobBar({ total: 0 });
}

function renderCart() {
  const totals = computeTotals();
  const lines = cart.map((it, idx) => {
    const p = productMap[it.id];
    const stock = effectiveStockOf(it);
    const stockState = stock <= 0 ? 'out' : (stock <= 5 ? 'low' : 'ok');
    const stockLabel = stock <= 0 ? 'Stokta yok' : (stock <= 5 ? `Son ${stock} adet` : 'Stokta');
    const currentPrice = unitPriceOf(it);
    const oldPrice = (!it.variant_id && p && p.old_price && p.old_price > p.price) ? p.old_price : null;
    const lineTotal = currentPrice * (it.qty || 0);
    const maxQty = Math.max(0, stock);
    const stepperDisabled = stock <= 0;

    return `
      <div class="line" data-idx="${idx}">
        <div class="line-thumb">
          ${it.image ? `<img src="${escapeAttr(it.image)}" alt="${escapeAttr(it.name || '')}" loading="lazy" />` : escapeHtml(it.icon || '📦')}
        </div>
        <div class="line-info">
          <div class="line-name">
            <a href="product.html?id=${it.id}">${escapeHtml(it.name || '')}</a>
            ${it.variant_name ? `<span style="display:inline-block;margin-top:.2rem;font-size:.78rem;color:var(--muted);font-weight:600;">${escapeHtml(it.variant_name)}</span>` : ''}
          </div>
          <div class="line-meta">
            <span class="line-price">
              ${oldPrice ? `<span class="line-price-old">${fmt(oldPrice)}</span>` : ''}${fmt(currentPrice)}${oldPrice ? `<span class="line-discount-chip">-%${Math.round((1-currentPrice/oldPrice)*100)}</span>` : ''}
            </span>
            <span class="stock-chip ${stockState}">● ${stockLabel}</span>
          </div>
        </div>
        <div class="line-side">
          <div class="qty-stepper">
            <button type="button" onclick="changeQty(${idx}, -1)" aria-label="Azalt">−</button>
            <input type="number" min="1" max="${Math.max(1, maxQty)}" value="${it.qty}" oninput="onQtyInput(${idx}, this.value)" ${stepperDisabled ? 'disabled' : ''} aria-label="Adet" />
            <button type="button" onclick="changeQty(${idx}, 1)" ${stepperDisabled || it.qty >= maxQty ? 'disabled' : ''} aria-label="Arttır">+</button>
          </div>
          <div class="line-total">${fmt(lineTotal)}</div>
          <button class="line-remove" onclick="removeLine(${idx})" title="Sil" aria-label="Sepetten sil">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
    `;
  }).join('');

  // Kupon bölümü
  const couponSection = appliedCoupon ? `
    <div class="coupon-applied">
      <span>✓ <strong>${escapeHtml(appliedCoupon.code)}</strong> uygulandı</span>
      <button type="button" onclick="removeCoupon()">Kaldır</button>
    </div>
  ` : `
    <div class="coupon">
      <input id="couponInput" class="coupon-input" type="text" placeholder="Kupon kodu" maxlength="32" autocomplete="off" />
      <button class="coupon-btn" id="couponBtn" type="button" onclick="applyCoupon()">Uygula</button>
    </div>
    <div class="coupon-hint" id="couponHint"></div>
  `;

  // Kargo mesajı
  const threshold = Number(shippingSettings.shipping_free_threshold) || 0;
  const remainingForFree = Math.max(0, threshold - totals.taxable);
  const shippingMsg = totals.shipping === 0
    ? (threshold > 0 && totals.taxable > 0 ? `✓ ${fmt(threshold)} üzeri kargo ücretsiz` : '')
    : `${fmt(threshold - totals.taxable)} daha alışveriş yap, kargo bizden`;

  const checkoutDisabled = !cart.length || totals.total <= 0;

  $('#content').innerHTML = `
    <div class="cart-grid">
      <div class="cart-lines">${lines}</div>
      <aside class="summary">
        <h2>Sipariş Özeti</h2>
        <div class="sum-row">
          <span class="k">Ara Toplam</span>
          <span class="v">${fmt(totals.subtotal)}</span>
        </div>
        ${appliedCoupon ? `
          <div class="sum-row">
            <span class="k">İndirim${appliedCoupon.type === 'percent' ? ` (${appliedCoupon.value}%)` : ''}</span>
            <span class="v discount">−${fmt(totals.discount)}</span>
          </div>
        ` : ''}
        <div class="sum-row">
          <span class="k">Kargo</span>
          <span class="v shipping ${totals.shipping === 0 ? 'free' : ''}">${totals.shipping === 0 ? (shippingMsg || 'Ücretsiz') : fmt(totals.shipping)}</span>
        </div>
        <div class="sum-row">
          <span class="k">KDV (%${shippingSettings.tax_rate})</span>
          <span class="v">${fmt(totals.tax)}</span>
        </div>
        <hr class="sum-divider" />
        <div class="sum-row total">
          <span class="k">Toplam</span>
          <span class="v">${fmt(totals.total)}</span>
        </div>
        ${couponSection}
        <button class="btn btn-primary btn-block lg" ${checkoutDisabled ? 'disabled' : ''} onclick="proceedToCheckout()">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          Ödemeye Geç
        </button>
        <a class="continue-link" href="index.html">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Alışverişe Devam
        </a>
        ${remainingForFree > 0 && totals.shipping > 0 ? `
          <p style="margin-top:.75rem;font-size:.78rem;color:var(--muted);">${fmt(remainingForFree)} daha alışveriş yap, kargo <strong style="color:var(--success);">ücretsiz</strong> olsun.</p>
        ` : ''}
        <div class="trust">
          <div class="item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            256-bit SSL
          </div>
          <div class="card-logos" style="display:inline-flex;align-items:center;gap:.4rem;">
            <img src="images/visa.png" alt="Visa" style="height:24px;width:auto;display:block;" />
            <img src="images/mastercard.png" alt="Mastercard" style="height:24px;width:auto;display:block;" />
            <img src="images/troy.webp" alt="Troy" style="height:24px;width:auto;display:block;" />
          </div>
          <div class="item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            Kutu açılmamışsa 14 gün içinde iade
          </div>
          <div class="item">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            Güvenli ödeme
          </div>
        </div>
      </aside>
    </div>
  `;

  // Kupon hint mesajını sıfırla
  if (!appliedCoupon) {
    const hint = $('#couponHint');
    if (hint) hint.textContent = '';
  }

  renderMobBar(totals);
}

function renderMobBar(totals) {
  const totalEl = $('#mobBarTotal');
  const btnEl = $('#mobBarBtn');
  const barEl = $('#mobBar');
  if (!totalEl || !btnEl || !barEl) return;
  const hasItems = cart.length > 0 && totals.total > 0;
  totalEl.textContent = fmt(totals.total);
  btnEl.disabled = !hasItems;
  barEl.setAttribute('aria-hidden', String(!hasItems));
}

function changeQty(idx, delta) {
  const it = cart[idx];
  if (!it) return;
  const stock = effectiveStockOf(it);
  const newQty = (it.qty || 0) + delta;
  if (newQty < 1) { removeLine(idx); return; }
  if (newQty > stock) {
    if (stock <= 0) showToast('Stokta yok', 'danger');
    else showToast(`Stokta yalnızca ${stock} adet var`, 'danger');
    return;
  }
  it.qty = newQty;
  saveCart(cart);
  render();
}

function onQtyInput(idx, value) {
  const v = parseInt(value, 10);
  if (isNaN(v) || v < 1) return;
  const it = cart[idx];
  if (!it) return;
  const stock = effectiveStockOf(it);
  if (v > stock) {
    showToast(`Stokta yalnızca ${stock} adet var`, 'danger');
    it.qty = stock;
  } else {
    it.qty = v;
  }
  saveCart(cart);
  // input değişiminde adım render etmeyelim (kullanıcı yazarken sıçramasın),
  // sadece persist + count güncelle
  renderHeaderCount();
}

function removeLine(idx) {
  const it = cart[idx];
  if (!it) return;
  saveCart(cart.filter((_, i) => i !== idx));
  render();
  showToast(`${it.name || 'Ürün'} sepetten çıkarıldı`, 'info');
}

/* ── KUPON ── */
async function applyCoupon() {
  const input = $('#couponInput');
  const hint = $('#couponHint');
  const btn = $('#couponBtn');
  if (!input || !hint) return;
  const code = (input.value || '').trim().toUpperCase();
  if (!code) { hint.classList.add('err'); hint.textContent = 'Kupon kodu girin.'; return; }
  if (!window.api) { hint.classList.add('err'); hint.textContent = 'API hazır değil, sayfayı yenileyin.'; return; }
  btn.disabled = true; input.disabled = true;
  try {
    const c = await api.coupons.validate(code);
    if (!c) throw new Error('Geçersiz kupon');
    appliedCoupon = { code: c.code || code, type: c.type, value: Number(c.value || 0), min_order: Number(c.min_order || 0) };
    try { localStorage.setItem(COUPON_KEY, JSON.stringify(appliedCoupon)); } catch (_) {}
    showToast(`Kupon uygulandı: ${appliedCoupon.code}`, 'success');
    render();
  } catch (e) {
    hint.classList.add('err');
    hint.textContent = e && e.message ? e.message : 'Kupon geçersiz veya kullanım dışı.';
  } finally {
    btn.disabled = false; input.disabled = false;
  }
}
function removeCoupon() {
  appliedCoupon = null;
  try { localStorage.removeItem(COUPON_KEY); } catch (_) {}
  render();
  showToast('Kupon kaldırıldı', 'info');
}

/* ── CHECKOUT'A GİT ── */
function proceedToCheckout() {
  if (submitting) return;
  if (!cart.length) return;
  submitting = true;
  // Kupon bilgisini sessionStorage'a yaz — checkout.html oradan okur
  if (appliedCoupon) {
    try { sessionStorage.setItem('tt_coupon_for_checkout', JSON.stringify(appliedCoupon)); } catch (_) {}
  } else {
    try { sessionStorage.removeItem('tt_coupon_for_checkout'); } catch (_) {}
  }
  location.href = 'checkout.html';
}

/* ── INIT ── */
async function loadSettings() {
  if (!window.api || !api.settings || !api.settings.list) return;
  try {
    const s = await api.settings.list();
    if (s && typeof s === 'object') {
      if (s.shipping_free_threshold !== undefined) shippingSettings.shipping_free_threshold = Number(s.shipping_free_threshold);
      if (s.shipping_fee_default !== undefined) shippingSettings.shipping_fee_default = Number(s.shipping_fee_default);
      if (s.tax_rate !== undefined) shippingSettings.tax_rate = Number(s.tax_rate);
    }
  } catch (_) { /* settings endpoint yoksa varsayılanları kullan */ }
}

async function loadProducts() {
  if (!window.api) return;
  try {
    const all = await api.products.listPublic();
    productMap = {};
    (all || []).forEach(p => { productMap[p.id] = p; });
  } catch (e) {
    // 404 / network — localStorage cart'ı göster, sadece stok kontrolü eksik olur
    productMap = {};
  }
}

function loadCouponFromStorage() {
  try {
    const raw = localStorage.getItem(COUPON_KEY);
    if (!raw) return;
    const c = JSON.parse(raw);
    if (c && c.code && (c.type === 'percent' || c.type === 'fixed')) {
      appliedCoupon = c;
    }
  } catch (_) {}
}

async function init() {
  applyTheme();
  cart = getCart();
  loadCouponFromStorage();
  renderHeaderCount();
  render(); // önce localStorage cart'ı göster (placeholder thumb/price)
  await Promise.all([loadSettings(), loadProducts()]);
  // Ürünler yüklendi, şimdi gerçek fiyat/stok ile yeniden render
  render();
  syncReservations();
}

ttReady(init);
</script>
</body>
</html>
