name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml

  lint:
    name: Lint & types (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint (bloklar)
        run: ruff check app tests
      - name: Ruff format check (bloklar)
        run: ruff format --check app tests
      - name: Mypy (bloklayıcı)
        run: mypy app

  alembic-check:
    name: Migration sanity (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tecnotools
          POSTGRES_PASSWORD: tecnotools
          POSTGRES_DB: tecnotools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tecnotools"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://tecnotools:tecnotools@localhost:5432/tecnotools
          APP_SECRET_KEY: ci-secret-key-min-32-characters-long
          INITIAL_ADMIN_PASSWORD: CIPass123!
        run: alembic upgrade head

      - name: Verify schema
        env:
          PGPASSWORD: tecnotools
        run: |
          psql -h localhost -U tecnotools -d tecnotools -c "\dt" | tee tables.txt
          # En az 15 tablo bekleniyor (user, product, order, ...)
          test "$(grep -c '|' tables.txt)" -ge 16

  build-image:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: tecnotools-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
