<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>TecnoTools Ürün Kartı · 1080×1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════════════════════
     KARUSEL ÜRÜN KARTI ŞABLONU
     Her ürün için bu dosyayı kopyala ve şu 4 yeri değiştir:
       1) Ürün fotoğrafı  → .product-img içindeki <img src="...">
       2) Ürün adı        → <h2 class="name">...
       3) Fiyat           → .price (ve istersen .old-price)
       4) Ürün linki      → en dıştaki <a href="https://tecnotools.org/product?id=NO">
     İndirim/etiket istemiyorsan .tag satırını sil.
     ════════════════════════════════════════════════════════════════ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #334155; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; font-family: 'Poppins', system-ui, sans-serif;
  }
  .card {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    text-decoration: none; color: #fff; display: block;
    background:
      radial-gradient(760px 520px at 20% 6%, rgba(96,165,250,.42), transparent 58%),
      radial-gradient(720px 600px at 98% 96%, rgba(251,113,133,.30), transparent 56%),
      radial-gradient(1000px 1000px at 50% 50%, #16264f 0%, #0a1226 72%);
    transform: scale(0.62);
    box-shadow: 0 40px 120px rgba(0,0,0,.55); border-radius: 8px;
  }
  .pad { position: absolute; inset: 64px; display: flex; flex-direction: column; }

  /* Üst: logo + opsiyonel etiket */
  .top { display: flex; align-items: flex-start; justify-content: space-between; }
  .logo { width: 270px; height: auto; mix-blend-mode: normal;
          filter: drop-shadow(0 6px 24px rgba(96,165,250,.4)); }
  .tag {
    background: linear-gradient(135deg, #fb7185, #ef4444); color: #fff;
    font-weight: 800; font-size: 28px; padding: 12px 26px; border-radius: 999px;
    box-shadow: 0 12px 30px rgba(239,68,68,.45); margin-top: 6px;
  }

  /* Ürün fotoğrafı — beyaz kart (beyaz zeminli ürün foto'su temiz dursun) */
  .product-img {
    margin: 40px auto 0; width: 620px; height: 500px;
    background: #fff; border-radius: 28px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.4);
  }
  .product-img img { width: 100%; height: 100%; object-fit: contain; padding: 28px; }
  /* foto eklenene kadar görünecek kılavuz */
  .ph { color: #94a3b8; font-size: 26px; font-weight: 600; text-align: center; }

  /* Ürün bilgisi */
  .info { margin-top: 44px; text-align: center; }
  .name {
    font-size: 52px; font-weight: 800; line-height: 1.1; letter-spacing: -1px;
    text-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .price-row { margin-top: 22px; display: flex; align-items: baseline; justify-content: center; gap: 18px; }
  .old-price { font-size: 36px; font-weight: 600; color: #94a3b8; text-decoration: line-through; }
  .price {
    font-size: 70px; font-weight: 900; letter-spacing: -1px;
    background: linear-gradient(90deg, #60a5fa, #fb7185);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* İncele butonu */
  .cta {
    margin: 44px auto 0; width: max-content;
    background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff;
    font-size: 36px; font-weight: 800; padding: 24px 70px; border-radius: 16px;
    box-shadow: 0 18px 40px rgba(37,99,235,.5); display: flex; align-items: center; gap: 14px;
  }
  .cta svg { width: 32px; height: 32px; stroke: #fff; }

  .site { margin-top: auto; text-align: center; font-size: 28px; font-weight: 700; color: #93c5fd; }
</style>
</head>
